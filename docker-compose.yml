services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: facility_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Resolve host.docker.internal so OLLAMA_URL can reach the host's Ollama.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}@postgres:5432/facility_db?sslmode=prefer
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-your_client_id_here}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Ollama draai op die Windows-gasheer; host.docker.internal word deur
      # extra_hosts hierbo opgelos (sien reël 22-24).
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    profiles: ["web"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # Relatiewe API-pad: nginx proxie /api/ na die backend, so dieselfde
      # geboude bundel werk by localhost, LAN-IP en die publieke domein.
      - REACT_APP_API_URL=/api
      # MSAL-herleiding is nou dinamies (window.location.origin), maar hierdie
      # kan nog oorheers word as jy 'n spesifieke publieke URL wil afdwing.
      # - REACT_APP_REDIRECT_URI=https://YOUR_DOMAIN/auth/callback
      - REACT_APP_MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-your_client_id_here}
      - REACT_APP_MICROSOFT_TENANT_ID=common
    stdin_open: true
    tty: true
    depends_on:
      - backend

  # Cloudflare Tunnel: expose die on-prem web/API aan die publieke web sonder
  # router-port-forward. Outbound-only, so dit werk agter NAT/CGNAT. Data bly
  # op die on-prem toestel. Stel CF_TUNNEL_TOKEN of gebruik 'n config.yml.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    profiles: ["public"]
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:-}
      # Alternatief vir quickstart sonder token:
      # - TUNNEL_ID=${CF_TUNNEL_ID:-}
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - frontend

volumes:
  postgres_data: