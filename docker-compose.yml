services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: facility_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:password@postgres:5432/facility_db
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-your_client_id_here}
      # Local dev default. For any real deployment set ENVIRONMENT to a non-dev
      # value (e.g. production) AND provide a strong AUTH_SECRET_KEY, otherwise
      # the backend refuses to start. Generate one with:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-your_client_id_here}
      - REACT_APP_MICROSOFT_TENANT_ID=common
      - REACT_APP_REDIRECT_URI=http://localhost:3000/auth/callback
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  postgres_data: