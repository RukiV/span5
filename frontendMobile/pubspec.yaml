name: fbs
description: "FBS"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.7
  mobile_scanner: ^7.2.0
  geolocator: ^13.0.1
  local_auth: ^2.2.0
  path_provider: ^2.1.2
  flutter_secure_storage: ^9.2.2
  qr_flutter: ^4.1.0
  google_maps_flutter: ^2.17.0
  dio: ^5.7.0
  flutter_dotenv: ^5.1.0
  table_calendar: ^3.1.2
  intl: ^0.19.0

  # Push notifications
  flutter_local_notifications: ^18.0.0
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.0

  # Kwotasie PDF's: kies 'n PDF-lêer en maak dit in 'n eksterne besigtiger oop
  file_picker: ^8.1.2
  open_filex: ^4.4.0
  flutter_appauth: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  http_mock_adapter: ^0.6.1
flutter:
  uses-material-design: true

  config:
    enable-lldb-debugging: false

  assets:
    - .env
    - assets/images/
